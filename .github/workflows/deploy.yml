name: Deploy to ktn
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: [self-hosted, ktn]
    steps:
      # actions/setup-node provisions Node onto PATH for the runner's job working
      # directory. ktn's system Node is 18, too old for Vite 8 / Vitest 5.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The host nginx serves nonet.kautiontape.com from dist/ and terminates TLS.
      - name: Deploy
        run: |
          cd /opt/services/kaution-sudoku
          git pull origin main
          npm ci
          npm run build
